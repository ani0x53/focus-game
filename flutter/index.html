<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLUTTER — Butterfly Flip</title>
  <style>
    :root {
      --bg: #0b0f0c;
      --surface: #141a15;
      --text: #ffffff;
      --sub: #9ca3af;
      --border: #2d3530;
      --accent: #34d399;

      /* butterfly colors */
      --c-red:    #f87171;
      --c-blue:   #60a5fa;
      --c-amber:  #fbbf24;
      --c-violet: #c084fc;
      --c-teal:   #2dd4bf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 440px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-link {
      color: var(--sub); text-decoration: none;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .home-link:hover { color: var(--text); }

    h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.18em; color: var(--accent); }

    /* ── Top stats ── */
    .top-bar {
      display: flex; justify-content: space-around;
      width: 100%; max-width: 440px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 0.64rem; color: var(--sub); letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-value { font-size: 1.5rem; font-weight: 900; }
    #freed-val { color: var(--accent); }
    #flips-val { color: var(--text); }
    #best-val  { color: var(--sub); font-size: 1.1rem; }

    /* ── Difficulty ── */
    .diffs {
      display: flex; gap: 8px;
      padding: 12px 16px 4px;
    }
    .diff-btn {
      flex: 1; padding: 7px 0;
      border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--sub);
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
      max-width: 110px;
    }
    .diff-btn.active { background: var(--accent); border-color: var(--accent); color: #111; }
    .diff-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    .controls {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 16px 12px;
    }
    #btn-new {
      padding: 7px 14px;
      border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--sub);
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
    }
    #btn-new:hover { border-color: var(--accent); color: var(--text); }

    /* ── Grid ── */
    #grid-wrap {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 12px;
      flex: 1;
    }

    #grid {
      display: grid;
      gap: 8px;
    }

    /* ── Tile ── */
    .tile {
      position: relative;
      cursor: pointer;
      perspective: 500px;
    }

    .tile-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.38s ease;
      border-radius: 10px;
    }

    .tile.revealed .tile-inner {
      transform: rotateY(180deg);
    }

    .tile-back, .tile-front {
      position: absolute; inset: 0;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: var(--tile-emoji-size);
    }

    .tile-back {
      background: var(--surface);
      border: 2px solid var(--border);
    }
    .tile-back::after { content: '🫧'; opacity: 0.5; }

    .tile-front {
      transform: rotateY(180deg);
      border: 2px solid rgba(255,255,255,0.15);
    }

    /* color variants */
    .tile-front.red    { background: rgba(248,113,113,0.22); border-color: var(--c-red); }
    .tile-front.blue   { background: rgba(96,165,250,0.22);  border-color: var(--c-blue); }
    .tile-front.amber  { background: rgba(251,191,36,0.22);  border-color: var(--c-amber); }
    .tile-front.violet { background: rgba(192,132,252,0.22); border-color: var(--c-violet); }
    .tile-front.teal   { background: rgba(45,212,191,0.22);  border-color: var(--c-teal); }

    /* freed: glows then fades */
    .tile.freed .tile-inner {
      animation: free-fly 0.65s ease forwards;
    }
    @keyframes free-fly {
      0%   { transform: rotateY(180deg) scale(1);    opacity: 1; }
      30%  { transform: rotateY(180deg) scale(1.18) translateY(-4px); opacity: 1; }
      100% { transform: rotateY(180deg) scale(0.3)  translateY(-40px); opacity: 0; }
    }

    /* matched line flash */
    .tile.matched-flash .tile-inner {
      animation: flash 0.25s ease 2 alternate;
    }
    @keyframes flash {
      from { filter: brightness(1); }
      to   { filter: brightness(2.5); }
    }

    /* ── Color legend ── */
    #legend {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      padding: 8px 16px;
    }
    .legend-dot {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.7rem; color: var(--sub);
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* ── Status / result ── */
    #status {
      text-align: center;
      padding: 8px 16px 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--sub);
      min-height: 32px;
    }
    #status.win  { color: var(--accent); }
    #status.lose { color: #f87171; }

    /* ── Result overlay ── */
    #result-banner {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    #result-banner.show { display: flex; }

    .result-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 36px;
      text-align: center;
      display: flex; flex-direction: column; gap: 12px;
      max-width: 320px; width: 90%;
    }

    .result-grade { font-size: 3rem; }
    .result-title { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.1em; color: var(--accent); }
    .result-score { font-size: 2.5rem; font-weight: 900; }
    .result-sub   { font-size: 0.82rem; color: var(--sub); }
    .result-best  { font-size: 0.82rem; color: var(--sub); }
    .result-best strong { color: var(--text); }

    .big-btn {
      padding: 13px 0;
      border: none; border-radius: 10px;
      background: var(--accent); color: #111;
      font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; margin-top: 6px;
      transition: opacity 0.15s;
    }
    .big-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="../">← Home</a>
  <h1>FLUTTER</h1>
  <div style="width:60px"></div>
</header>

<div class="top-bar">
  <div class="stat-box">
    <div class="stat-label">Freed</div>
    <div class="stat-value" id="freed-val">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Flips Left</div>
    <div class="stat-value" id="flips-val">—</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Best</div>
    <div class="stat-value" id="best-val">—</div>
  </div>
</div>

<div class="diffs">
  <button class="diff-btn" data-diff="easy">Easy</button>
  <button class="diff-btn active" data-diff="medium">Medium</button>
  <button class="diff-btn" data-diff="hard">Hard</button>
</div>
<div class="controls">
  <button id="btn-new">New Game</button>
  <div id="status"></div>
</div>

<div id="grid-wrap">
  <div id="grid"></div>
</div>

<div id="legend"></div>

<div id="result-banner">
  <div class="result-box">
    <div class="result-grade" id="r-grade">🦋</div>
    <div class="result-title" id="r-title">FLUTTER</div>
    <div class="result-score"><span id="r-freed">0</span> <span style="font-size:1rem;color:var(--sub)">freed</span></div>
    <div class="result-sub" id="r-sub"></div>
    <div class="result-best" id="r-best"></div>
    <button class="big-btn" id="btn-play-again">Play Again</button>
  </div>
</div>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const COLORS = [
  { id: 'red',    label: 'Rose',    hex: '#f87171', emoji: '🔴' },
  { id: 'blue',   label: 'Sky',     hex: '#60a5fa', emoji: '🔵' },
  { id: 'amber',  label: 'Gold',    hex: '#fbbf24', emoji: '🟡' },
  { id: 'violet', label: 'Violet',  hex: '#c084fc', emoji: '🟣' },
  { id: 'teal',   label: 'Teal',    hex: '#2dd4bf', emoji: '🟢' },
];

const BUTTERFLY = '🦋';

const DIFFS = {
  easy:   { size: 4, colors: 4, flips: 20, target: 12 },
  medium: { size: 5, colors: 5, flips: 18, target: 18 },
  hard:   { size: 5, colors: 5, flips: 13, target: 15 },
};

const GRADES = [
  { min: 1.0, grade: '🌟🌟🌟', title: 'Perfect!',     sub: 'All butterflies freed!' },
  { min: 0.8, grade: '🌟🌟',   title: 'Amazing!',     sub: 'Nearly all freed.' },
  { min: 0.6, grade: '🌟',     title: 'Nice work!',   sub: 'More than half freed.' },
  { min: 0.4, grade: '🦋',     title: 'Good try!',    sub: 'Keep practicing.' },
  { min: 0,   grade: '🫧',     title: 'Try again!',   sub: 'The butterflies wait...' },
];

// ─── State ───────────────────────────────────────────────────────────────────
let diff    = 'medium';
let cfg     = DIFFS[diff];
let grid    = [];   // {color, revealed, freed}
let flipsLeft = 0;
let freedCount = 0;
let totalTiles = 0;
let locked  = false;
let gameOver = false;

let stats = JSON.parse(localStorage.getItem('focus-flutter-stats') || 'null') || { best: 0, played: 0 };

function saveStats() {
  localStorage.setItem('focus-flutter-stats', JSON.stringify(stats));
  document.getElementById('best-val').textContent = stats.best || '—';
}
saveStats();

// ─── Helpers ─────────────────────────────────────────────────────────────────
function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function getAllLines(size) {
  const lines = [];
  // Horizontal runs of 3
  for (let r = 0; r < size; r++)
    for (let c = 0; c <= size-3; c++)
      lines.push([r*size+c, r*size+c+1, r*size+c+2]);
  // Vertical runs of 3
  for (let c = 0; c < size; c++)
    for (let r = 0; r <= size-3; r++)
      lines.push([r*size+c, (r+1)*size+c, (r+2)*size+c]);
  // Diagonal ↘ runs of 3
  for (let r = 0; r <= size-3; r++)
    for (let c = 0; c <= size-3; c++)
      lines.push([r*size+c, (r+1)*size+(c+1), (r+2)*size+(c+2)]);
  // Diagonal ↙ runs of 3
  for (let r = 0; r <= size-3; r++)
    for (let c = 2; c < size; c++)
      lines.push([r*size+c, (r+1)*size+(c-1), (r+2)*size+(c-2)]);
  return lines;
}

// ─── Generate grid ──────────────────────────────────────────────────────────
function generateGrid() {
  const { size, colors: numColors } = cfg;
  totalTiles = size * size;
  const perColor = Math.floor(totalTiles / numColors);
  const cells = [];

  for (let i = 0; i < numColors; i++) {
    for (let j = 0; j < perColor; j++) cells.push(COLORS[i]);
  }
  // Fill remainder randomly
  while (cells.length < totalTiles) {
    cells.push(COLORS[Math.floor(Math.random() * numColors)]);
  }

  return shuffle(cells).map(c => ({ color: c, revealed: false, freed: false }));
}

// ─── Build DOM ───────────────────────────────────────────────────────────────
function buildGrid() {
  const { size } = cfg;
  const el = document.getElementById('grid');
  const wrap = document.getElementById('grid-wrap');

  const maxW  = Math.min(wrap.clientWidth - 24, 420);
  const gap   = 8;
  const tileW = Math.floor((maxW - gap * (size-1)) / size);

  el.style.gridTemplateColumns = `repeat(${size}, ${tileW}px)`;
  el.style.setProperty('--tile-emoji-size', Math.floor(tileW * 0.48) + 'px');
  el.innerHTML = '';

  grid.forEach((cell, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.idx = i;
    tile.style.width  = tileW + 'px';
    tile.style.height = tileW + 'px';

    tile.innerHTML = `
      <div class="tile-inner">
        <div class="tile-back"></div>
        <div class="tile-front ${cell.color.id}">${BUTTERFLY}</div>
      </div>`;

    tile.addEventListener('click', () => onFlip(i));
    el.appendChild(tile);
  });
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  const { colors: numColors } = cfg;
  for (let i = 0; i < numColors; i++) {
    const c = COLORS[i];
    const d = document.createElement('div');
    d.className = 'legend-dot';
    d.innerHTML = `<div class="dot" style="background:${c.hex}"></div>${c.label}`;
    el.appendChild(d);
  }
}

// ─── Flip ────────────────────────────────────────────────────────────────────
function onFlip(idx) {
  if (locked || gameOver) return;
  const cell = grid[idx];
  if (cell.revealed || cell.freed) return;
  if (flipsLeft <= 0) return;

  cell.revealed = true;
  flipsLeft--;

  const tileEl = document.querySelector(`.tile[data-idx="${idx}"]`);
  tileEl.classList.add('revealed');

  updateCounters();

  // Check after flip animation
  locked = true;
  setTimeout(() => {
    checkMatches();
    locked = false;
    if (flipsLeft <= 0 && !gameOver) {
      setTimeout(endGame, 400);
    }
  }, 420);
}

// ─── Check matches ───────────────────────────────────────────────────────────
function checkMatches() {
  const { size } = cfg;
  const lines = getAllLines(size);
  const toFree = new Set();

  for (const [a, b, c] of lines) {
    const ta = grid[a], tb = grid[b], tc = grid[c];
    if (!ta || !tb || !tc) continue;
    if (!ta.revealed || !tb.revealed || !tc.revealed) continue;
    if (ta.freed || tb.freed || tc.freed) continue;
    if (ta.color.id === tb.color.id && tb.color.id === tc.color.id) {
      toFree.add(a); toFree.add(b); toFree.add(c);
    }
  }

  if (toFree.size === 0) return;

  // Flash first, then free
  toFree.forEach(idx => {
    document.querySelector(`.tile[data-idx="${idx}"]`).classList.add('matched-flash');
  });

  setTimeout(() => {
    toFree.forEach(idx => {
      grid[idx].freed = true;
      freedCount++;
      const el = document.querySelector(`.tile[data-idx="${idx}"]`);
      el.classList.remove('matched-flash');
      el.classList.add('freed');
      el.style.pointerEvents = 'none';
    });
    updateCounters();

    const allFreed = grid.every(c => c.freed || !c.revealed && false);
    const allDone  = grid.every(c => c.freed);
    if (allDone) setTimeout(endGame, 700);
    else if (freedCount >= totalTiles) setTimeout(endGame, 700);
  }, 500);
}

// ─── UI updates ──────────────────────────────────────────────────────────────
function updateCounters() {
  document.getElementById('freed-val').textContent = freedCount;
  document.getElementById('flips-val').textContent = flipsLeft;

  const { target } = cfg;
  const pct = freedCount / totalTiles;
  const status = document.getElementById('status');
  if (freedCount >= totalTiles) {
    status.textContent = 'All butterflies freed! 🎉';
    status.className = 'win';
  } else if (freedCount >= target) {
    status.textContent = `${freedCount} freed — you're winning!`;
    status.className = 'win';
  } else {
    status.textContent = freedCount > 0 ? `${freedCount} butterflies freed so far` : 'Flip tiles to find matching butterflies';
    status.className = '';
  }
}

// ─── End game ────────────────────────────────────────────────────────────────
function endGame() {
  if (gameOver) return;
  gameOver = true;

  // Reveal remaining hidden tiles briefly
  grid.forEach((cell, i) => {
    if (!cell.revealed && !cell.freed) {
      document.querySelector(`.tile[data-idx="${i}"]`).classList.add('revealed');
    }
  });

  stats.played++;
  if (freedCount > stats.best) stats.best = freedCount;
  saveStats();

  setTimeout(showResult, 800);
}

function showResult() {
  const ratio = freedCount / totalTiles;
  const grade = GRADES.find(g => ratio >= g.min) || GRADES[GRADES.length-1];

  document.getElementById('r-grade').textContent  = grade.grade;
  document.getElementById('r-title').textContent  = grade.title;
  document.getElementById('r-freed').textContent  = freedCount;
  document.getElementById('r-sub').textContent    = grade.sub;
  document.getElementById('r-best').innerHTML     =
    freedCount >= stats.best
      ? `<strong style="color:#34d399">New best! 🎉</strong>`
      : `Best: <strong>${stats.best}</strong> freed`;

  document.getElementById('result-banner').classList.add('show');
}

// ─── New game ────────────────────────────────────────────────────────────────
function newGame() {
  cfg = DIFFS[diff];
  freedCount = 0;
  flipsLeft  = cfg.flips;
  locked     = false;
  gameOver   = false;

  document.getElementById('result-banner').classList.remove('show');
  document.getElementById('status').textContent = '';
  document.getElementById('status').className   = '';

  grid = generateGrid();
  buildGrid();
  buildLegend();
  updateCounters();

  document.getElementById('freed-val').textContent = '0';
  document.getElementById('flips-val').textContent = cfg.flips;
}

// ─── Controls ────────────────────────────────────────────────────────────────
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.diff;
    newGame();
  });
});

document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('btn-play-again').addEventListener('click', newGame);

// ─── Boot ────────────────────────────────────────────────────────────────────
newGame();
</script>
</body>
</html>
