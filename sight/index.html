<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGHT — Sight Words</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1b;
      --text: #ffffff;
      --sub: #9ca3af;
      --border: #2d2d2f;
      --accent: #0ea5e9;
      --green: #4ade80;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 500px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .home-link {
      color: var(--sub); text-decoration: none;
      font-size: .78rem; font-weight: 700; letter-spacing: .05em; flex-shrink: 0;
    }
    .home-link:hover { color: var(--text); }
    h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: .18em; color: var(--accent); flex-shrink: 0; }
    .stats { display: flex; gap: 12px; font-size: .7rem; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
    .stats span strong { display: block; color: var(--text); font-size: 1rem; text-align: center; }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      max-width: 500px;
      padding: 10px 16px 8px;
      min-height: 0;
    }

    /* ── Start screen ── */
    #start-screen {
      display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; width: 100%;
    }
    .start-icon  { font-size: 3.2rem; }
    .start-title { font-size: 1.1rem; font-weight: 700; color: var(--sub); letter-spacing: .1em; }
    .start-desc  { font-size: .82rem; color: var(--sub); line-height: 1.7; max-width: 290px; }

    .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .level-card {
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 12px; padding: 16px 12px; cursor: pointer;
      transition: border-color .2s, transform .1s; text-align: center;
    }
    .level-card:hover  { border-color: var(--accent); }
    .level-card:active { transform: scale(.97); }
    .level-card.selected { border-color: var(--accent); background: rgba(14,165,233,.1); }
    .lc-icon  { font-size: 1.8rem; margin-bottom: 6px; }
    .lc-name  { font-size: .82rem; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
    .lc-count { font-size: .68rem; color: var(--sub); margin-top: 4px; }

    .big-btn {
      padding: 13px 40px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-size: .95rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: opacity .15s;
    }
    .big-btn:hover    { opacity: .85; }
    .big-btn:disabled { opacity: .35; cursor: default; }
    .ghost-btn {
      padding: 11px 36px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--sub);
      font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer; transition: border-color .2s, color .2s;
    }
    .ghost-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Game screen ── */
    #game-screen { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

    .round-meta {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
    }
    .level-badge {
      font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--accent); padding: 3px 9px; border-radius: 20px;
    }
    .progress-dots { display: flex; gap: 5px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--border);
      transition: background .3s;
    }
    .dot.correct { background: #4ade80; }
    .dot.wrong   { background: #f87171; }

    /* Word card */
    #word-card {
      background: var(--surface); border: 2px solid var(--border); border-radius: 16px;
      padding: 18px 28px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: border-color .25s;
    }
    #word-card.flash-correct { border-color: #4ade80; }
    #word-card.flash-wrong   { border-color: #f87171; }

    #the-word {
      font-size: clamp(2.4rem, 13vw, 3.6rem);
      font-weight: 900; letter-spacing: .04em; text-align: center;
    }
    @keyframes wordIn {
      from { opacity: 0; transform: scale(.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    #the-word.animate { animation: wordIn .22s ease; }

    #speak-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 20px;
      color: var(--sub); font-size: .72rem; font-weight: 700; letter-spacing: .06em;
      padding: 5px 13px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: border-color .2s, color .2s;
    }
    #speak-btn:hover { border-color: var(--accent); color: var(--accent); }
    #speak-btn.no-speech { display: none; }

    /* Choices */
    #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

    .choice-btn {
      padding: clamp(15px, 4.5vw, 22px) 8px;
      border: none; border-radius: 12px;
      font-size: clamp(1.15rem, 5.5vw, 1.55rem);
      font-weight: 800; cursor: pointer; color: #fff;
      transition: transform .1s, filter .15s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice-btn:active { transform: scale(.94); }
    .choice-btn:disabled { cursor: default; }

    .choice-btn[data-color="0"] { background: #3b82f6; }
    .choice-btn[data-color="1"] { background: #10b981; }
    .choice-btn[data-color="2"] { background: #f59e0b; color: #111; }
    .choice-btn[data-color="3"] { background: #ec4899; }

    .choice-btn.mark-correct { background: #4ade80 !important; color: #111 !important; transform: scale(1.05); }
    .choice-btn.mark-wrong   { background: #f87171 !important; color: #fff !important; }
    .choice-btn.dim          { opacity: .28; }

    .score-line { font-size: .72rem; color: var(--sub); letter-spacing: .06em; }
    .score-line strong { color: var(--text); }

    /* ── Result screen ── */
    #result-screen { display: none; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .res-stars { font-size: 2.4rem; letter-spacing: .08em; }
    .res-title { font-size: 1.5rem; font-weight: 900; letter-spacing: .1em; color: var(--accent); }
    .res-score { font-size: 3rem; font-weight: 900; line-height: 1; }
    .res-sub   { font-size: .82rem; color: var(--sub); }
    .res-best  { font-size: .8rem; color: var(--sub); }
    .res-best strong { color: var(--text); }
    .btn-row   { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="../">← Home</a>
  <div class="stats">
    <span>Stars<strong id="s-stars">0</strong></span>
    <span>Best<strong id="s-best">—</strong></span>
  </div>
  <h1>SIGHT</h1>
  <div style="width:42px"></div>
</header>

<div id="main">

  <!-- ── Start screen ── -->
  <div id="start-screen">
    <div class="start-icon">⭐</div>
    <div class="start-title">SIGHT WORDS</div>
    <div class="start-desc">
      Practice high-frequency words used in kindergarten &amp; 1st grade.<br>
      Pick a level and tap the matching word!
    </div>
    <div class="level-grid">
      <div class="level-card" id="lc-k" data-level="k">
        <div class="lc-icon">🌱</div>
        <div class="lc-name">KINDERGARTEN</div>
        <div class="lc-count">92 words</div>
      </div>
      <div class="level-card" id="lc-1" data-level="1">
        <div class="lc-icon">📚</div>
        <div class="lc-name">1ST GRADE</div>
        <div class="lc-count">41 words</div>
      </div>
    </div>
    <button class="big-btn" id="btn-start" disabled>Start Practice</button>
  </div>

  <!-- ── Game screen ── -->
  <div id="game-screen">
    <div class="round-meta">
      <div class="level-badge" id="level-badge">KINDERGARTEN</div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>

    <div id="word-card">
      <div id="the-word"></div>
      <button id="speak-btn">🔊 Hear it</button>
    </div>

    <div id="choices"></div>

    <div class="score-line">
      Word <strong id="q-num">1</strong> of <strong id="q-total">10</strong>
      &nbsp;·&nbsp; Correct: <strong id="q-correct">0</strong>
    </div>
  </div>

  <!-- ── Result screen ── -->
  <div id="result-screen">
    <div class="res-stars" id="res-stars">⭐</div>
    <div class="res-title" id="res-title">GREAT JOB!</div>
    <div class="res-score">
      <span id="res-score">10</span>
      <span style="font-size:1rem;color:var(--sub)">/10</span>
    </div>
    <div class="res-sub"  id="res-sub"></div>
    <div class="res-best" id="res-best"></div>
    <div class="btn-row">
      <button class="big-btn"   id="btn-again">Play Again</button>
      <button class="ghost-btn" id="btn-change">Change Level</button>
    </div>
  </div>

</div>

<script>
// ── Sight word lists (Dolch) ───────────────────────────────────────────────────
const WORDS = {
  k: [
    // Pre-Primer (40)
    'a','and','away','big','blue','can','come','down','find','for',
    'funny','go','help','here','I','in','is','it','jump','little',
    'look','make','me','my','not','one','play','red','run','said',
    'see','the','three','to','two','up','we','where','yellow','you',
    // Primer (52)
    'all','am','are','at','ate','be','black','brown','but','came',
    'did','do','eat','four','get','good','have','he','into','like',
    'must','new','no','now','on','our','out','please','pretty','ran',
    'ride','saw','say','she','so','soon','that','there','they','this',
    'too','under','want','was','well','went','what','white','who','will',
    'with','yes'
  ],
  '1': [
    'after','again','an','any','ask','as','by','could','every','fly',
    'from','give','going','had','has','her','him','his','how','just',
    'know','let','live','may','of','old','once','open','over','put',
    'round','some','stop','take','thank','them','then','think','walk','were',
    'when'
  ]
};

const ROUND_LEN = 10;

// ── State ─────────────────────────────────────────────────────────────────────
let selectedLevel = null, pool = [], queue = [], qIdx = 0, roundCorrect = 0;
let answering = false;
let stats = JSON.parse(localStorage.getItem('focus-sight-stats') || 'null')
          || { played: 0, stars: 0, best: 0 };

// ── UI refs ───────────────────────────────────────────────────────────────────
const startScreen  = document.getElementById('start-screen');
const gameScreen   = document.getElementById('game-screen');
const resultScreen = document.getElementById('result-screen');
const theWordEl    = document.getElementById('the-word');
const choicesEl    = document.getElementById('choices');
const dotWrap      = document.getElementById('progress-dots');
const qNumEl       = document.getElementById('q-num');
const qCorrectEl   = document.getElementById('q-correct');

// ── Stats ─────────────────────────────────────────────────────────────────────
function saveStats() {
  localStorage.setItem('focus-sight-stats', JSON.stringify(stats));
  document.getElementById('s-stars').textContent = stats.stars;
  document.getElementById('s-best').textContent  = stats.best ? `${stats.best}/10` : '—';
}
saveStats();

// ── Speech synthesis ──────────────────────────────────────────────────────────
const hasSpeech = !!window.speechSynthesis;
if (!hasSpeech) document.getElementById('speak-btn').classList.add('no-speech');

function speak(word) {
  if (!hasSpeech) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.rate = 0.75; u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}

document.getElementById('speak-btn').addEventListener('click', () => {
  if (queue[qIdx]) speak(queue[qIdx].word);
});

// ── Level selection ───────────────────────────────────────────────────────────
document.querySelectorAll('.level-card').forEach(card => {
  card.addEventListener('click', function () {
    document.querySelectorAll('.level-card').forEach(c => c.classList.remove('selected'));
    this.classList.add('selected');
    selectedLevel = this.dataset.level;
    document.getElementById('btn-start').disabled = false;
  });
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

// ── Build round queue ─────────────────────────────────────────────────────────
function buildQueue() {
  pool = [...WORDS[selectedLevel]];
  const words = shuffle(pool).slice(0, ROUND_LEN);
  queue = words.map(word => {
    const others = shuffle(pool.filter(w => w !== word));
    return { word, choices: shuffle([word, ...others.slice(0, 3)]) };
  });
  qIdx = 0; roundCorrect = 0;
}

// ── Progress dots ─────────────────────────────────────────────────────────────
function buildDots() {
  dotWrap.innerHTML = '';
  for (let i = 0; i < ROUND_LEN; i++) {
    const d = document.createElement('div');
    d.className = 'dot'; d.id = `dot-${i}`;
    dotWrap.appendChild(d);
  }
}

function markDot(idx, ok) {
  const d = document.getElementById(`dot-${idx}`);
  if (d) d.classList.add(ok ? 'correct' : 'wrong');
}

// ── Render question ───────────────────────────────────────────────────────────
function renderQuestion(idx) {
  answering = false;
  const { word, choices } = queue[idx];
  qNumEl.textContent = idx + 1;
  qCorrectEl.textContent = roundCorrect;

  // Animate word
  theWordEl.classList.remove('animate');
  void theWordEl.offsetWidth;
  theWordEl.textContent = word;
  theWordEl.classList.add('animate');

  // Reset word card state
  const card = document.getElementById('word-card');
  card.className = '';

  // Build choice buttons
  choicesEl.innerHTML = '';
  choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.color = i;
    btn.textContent = ch;
    btn.addEventListener('click', () => handleChoice(btn, ch === word, word));
    choicesEl.appendChild(btn);
  });

  // Speak after a short delay
  setTimeout(() => speak(word), 350);
}

// ── Handle answer ─────────────────────────────────────────────────────────────
function handleChoice(btn, isCorrect, correctWord) {
  if (answering) return;
  answering = true;

  const card    = document.getElementById('word-card');
  const allBtns = choicesEl.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.disabled = true);

  markDot(qIdx, isCorrect);

  if (isCorrect) {
    btn.classList.add('mark-correct');
    card.classList.add('flash-correct');
    roundCorrect++;
    setTimeout(advance, 620);
  } else {
    btn.classList.add('mark-wrong');
    card.classList.add('flash-wrong');
    // Highlight the correct answer
    allBtns.forEach(b => {
      if (b.textContent === correctWord) b.classList.add('mark-correct');
      else if (b !== btn) b.classList.add('dim');
    });
    setTimeout(advance, 1300);
  }
}

function advance() {
  qIdx++;
  if (qIdx < ROUND_LEN) renderQuestion(qIdx);
  else showResult();
}

// ── Result ────────────────────────────────────────────────────────────────────
function showResult() {
  hasSpeech && window.speechSynthesis.cancel();
  gameScreen.style.display   = 'none';
  resultScreen.style.display = 'flex';

  stats.played++;
  if (roundCorrect > stats.best) stats.best = roundCorrect;
  const earned = roundCorrect >= 10 ? 3 : roundCorrect >= 7 ? 2 : roundCorrect >= 5 ? 1 : 0;
  stats.stars += earned;
  saveStats();

  const msgs = [
    { title: 'Keep Trying!',  sub: 'Practice makes perfect — try again!', stars: '' },
    { title: 'Good Try!',     sub: 'You\'re getting better!',             stars: '⭐' },
    { title: 'Well Done!',    sub: 'Great reading skills!',               stars: '⭐⭐' },
    { title: 'AMAZING!',      sub: 'You know all the words!',             stars: '⭐⭐⭐' },
  ];
  const m = msgs[earned];

  document.getElementById('res-stars').textContent = m.stars || '💪';
  document.getElementById('res-title').textContent = m.title;
  document.getElementById('res-score').textContent = roundCorrect;
  document.getElementById('res-sub').textContent   = m.sub;
  document.getElementById('res-best').innerHTML    = roundCorrect === stats.best && stats.played > 1
    ? `<strong style="color:#4ade80">New best! 🎉</strong>`
    : `Best: <strong>${stats.best}/10</strong>`;
}

// ── Start / restart ───────────────────────────────────────────────────────────
function startGame() {
  buildQueue();
  buildDots();

  document.getElementById('level-badge').textContent  = selectedLevel === 'k' ? 'KINDERGARTEN' : '1ST GRADE';
  document.getElementById('q-total').textContent      = ROUND_LEN;
  document.getElementById('q-correct').textContent    = 0;

  startScreen.style.display  = 'none';
  resultScreen.style.display = 'none';
  gameScreen.style.display   = 'flex';

  renderQuestion(0);
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-again').addEventListener('click', startGame);
document.getElementById('btn-change').addEventListener('click', () => {
  hasSpeech && window.speechSynthesis.cancel();
  resultScreen.style.display = 'none';
  startScreen.style.display  = 'flex';
});
</script>
</body>
</html>
