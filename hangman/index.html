<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLOWS — Hangman</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1b;
      --text: #ffffff;
      --sub: #9ca3af;
      --border: #2d2d2f;
      --accent: #dc2626;
      --green: #538d4e;
      --gray: #3a3a3c;
      --key-bg: #818384;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      width: 100%; max-width: 500px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .home-link { color: var(--sub); text-decoration: none; font-size: .78rem; font-weight: 700; letter-spacing: .05em; flex-shrink: 0; }
    .home-link:hover { color: var(--text); }
    .stats { display: flex; gap: 12px; font-size: .7rem; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
    .stats span strong { display: block; color: var(--text); font-size: 1rem; text-align: center; }
    h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: .18em; color: var(--accent); flex-shrink: 0; }

    #btn-new {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 7px 12px; font-size: .72rem; font-weight: 700; cursor: pointer;
      letter-spacing: .06em; text-transform: uppercase; transition: opacity .15s; flex-shrink: 0;
    }
    #btn-new:hover { opacity: .8; }

    /* ── Toast ── */
    #toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 10px 22px; border-radius: 6px; font-weight: 700; font-size: .9rem;
      pointer-events: none; z-index: 200; opacity: 0; transition: opacity .2s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Start / difficulty screen ── */
    #start-screen {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; width: 100%; max-width: 500px; padding: 20px 16px;
    }
    .start-title { font-size: 1rem; font-weight: 700; color: var(--sub); letter-spacing: .12em; text-transform: uppercase; }

    .diff-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .diff-card {
      background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
      padding: 16px 18px; cursor: pointer; transition: border-color .2s, transform .1s;
      display: flex; align-items: center; gap: 14px;
    }
    .diff-card:hover  { border-color: var(--dc); }
    .diff-card:active { transform: scale(.98); }

    .dc-icon  { font-size: 1.6rem; flex-shrink: 0; }
    .dc-right { flex: 1; }
    .dc-name  { font-size: .95rem; font-weight: 800; letter-spacing: .1em; }
    .dc-desc  { font-size: .72rem; color: var(--sub); margin-top: 3px; line-height: 1.5; }
    .dc-badge { font-size: .62rem; font-weight: 700; border: 1px solid; padding: 2px 7px; border-radius: 20px; letter-spacing: .08em; text-transform: uppercase; float: right; }

    /* difficulty colour injection via inline style on each card */

    /* ── Game section ── */
    #game-section { display: none; flex-direction: column; align-items: center; flex: 1; width: 100%; }

    /* ── Game wrap ── */
    #game-wrap {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
      width: 100%; max-width: 500px; padding: 6px 16px 4px; min-height: 0;
    }

    /* Difficulty badge inside game */
    .diff-badge-game {
      font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      border: 1px solid; padding: 3px 9px; border-radius: 20px; flex-shrink: 0;
    }

    /* ── Hangman SVG ── */
    #hangman-svg {
      width: min(160px, 40vw);
      height: min(180px, 45vw);
      flex-shrink: 0;
    }
    .h-gallows { stroke: #4b5563; stroke-width: 3; stroke-linecap: round; fill: none; }
    .h-part {
      stroke: var(--text); stroke-width: 3.5; stroke-linecap: round; fill: none;
      opacity: 0; transition: opacity .25s ease;
    }
    .h-part.visible { opacity: 1; }
    .h-eye { fill: var(--text); stroke: none !important; stroke-width: 0; }

    /* ── Wrong display ── */
    #wrong-display { font-size: .8rem; color: var(--sub); letter-spacing: .1em; min-height: 1.1rem; text-align: center; }
    .w-letter { color: var(--accent); text-decoration: line-through; margin: 0 1px; }

    /* ── Guesses left ── */
    #guesses-left { font-size: .68rem; color: var(--sub); letter-spacing: .06em; transition: color .3s; }

    /* ── Vowel hint banner (easy only) ── */
    #vowel-hint {
      font-size: .68rem; color: var(--sub); letter-spacing: .05em;
      background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.25);
      padding: 4px 12px; border-radius: 20px; display: none;
    }
    #vowel-hint.show { display: block; }

    /* ── Word display ── */
    #word-display { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; padding: 2px 8px; }

    .letter-slot {
      width: clamp(22px, 6vw, 32px); height: clamp(28px, 7.5vw, 40px);
      border-bottom: 3px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(.9rem, 3.8vw, 1.25rem); font-weight: 700; text-transform: uppercase;
      color: var(--text); transition: color .2s, border-color .2s;
    }
    .letter-slot.revealed  { border-bottom-color: var(--green); }
    .letter-slot.vowel-pre { border-bottom-color: #4ade80; color: #4ade80; }
    .letter-slot.win  { color: #4ade80; border-bottom-color: #4ade80; }
    .letter-slot.lose { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Keyboard ── */
    #keyboard { padding: 2px 4px 10px; width: min(460px, 100vw); flex-shrink: 0; }
    .kb-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
    .key {
      height: 44px; min-width: 10px; flex: 1; max-width: 38px;
      border-radius: 4px; background: var(--key-bg); color: var(--text);
      font-weight: 700; font-size: .78rem; border: none; cursor: pointer;
      text-transform: uppercase; transition: background .2s, opacity .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .key:active { filter: brightness(.8); }
    .key:disabled { cursor: default; }
    .key[data-state="correct"] { background: var(--green); }
    .key[data-state="wrong"]   { background: var(--gray); opacity: .4; }
    .key[data-state="pre"]     { background: #15803d; opacity: .8; cursor: default; }
  </style>
</head>
<body>

<div id="toast"></div>

<header>
  <a class="home-link" href="../">← Home</a>

        </div>
        <div class="dc-desc">Short words · vowels revealed for you · 8 chances</div>
      </div>
    </div>

    <div class="diff-card" data-diff="medium" style="--dc:#f59e0b; border-color:#2d2d2f;">
      <div class="dc-icon">🟡</div>

</div>

<!-- ── Game ── -->
<div id="game-section">

      <!-- Gallows -->

      <line class="h-gallows" x1="50"  y1="200" x2="50"  y2="15"/>

      <!-- Body parts -->

      <line   class="h-part"            id="h-body" x1="140" y1="72"  x2="140" y2="128"/>
      <line   class="h-part"            id="h-larm" x1="140" y1="92"  x2="113" y2="116"/>

      <line   class="h-part"            id="h-lleg" x1="140" y1="128" x2="115" y2="165"/>
      <line   class="h-part"            id="h-rleg" x1="140" y1="128" x2="165" y2="165"/>
    </svg>

    <div id="vowel-hint">✨ Vowels revealed — guess the consonants!</div>
    <div id="wrong-display">—</div>
    <div id="word-display"></div>
    <div id="guesses-left"></div>

  </div>

  <div id="keyboard">
    <div class="kb-row" id="kr0"></div>
    <div class="kb-row" id="kr1"></div>
    <div class="kb-row" id="kr2"></div>
  </div>
</div>

// Easy gets 8 parts (head → eyes → body → arms → legs)
const PARTS = {
  easy:   ['h-head','h-leye','h-reye','h-body','h-larm','h-rarm','h-lleg','h-rleg'],
  medium: ['h-head','h-body','h-larm','h-rarm','h-lleg','h-rleg'],
  hard:   ['h-head','h-body','h-larm','h-rarm','h-lleg','h-rleg']
};

const DIFF_CFG = {
  easy:   { maxWrong: 8, revealVowels: true,  label: 'EASY',   color: '#4ade80' },
  medium: { maxWrong: 6, revealVowels: false, label: 'MEDIUM', color: '#f59e0b' },
  hard:   { maxWrong: 6, revealVowels: false, label: 'HARD',   color: '#dc2626' }
};

const VOWELS = new Set(['A','E','I','O','U']);
const KB_ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],

];

// ── State ─────────────────────────────────────────────────────────────────────

let maxWrong = 6;

let stats = JSON.parse(localStorage.getItem('focus-hangman-stats') || 'null')

// ── UI refs ───────────────────────────────────────────────────────────────────
const startScreen = document.getElementById('start-screen');
const gameSection = document.getElementById('game-section');
const wordWrap    = document.getElementById('word-display');
const wrongDisp   = document.getElementById('wrong-display');
const guessLeft   = document.getElementById('guesses-left');
const vowelHint   = document.getElementById('vowel-hint');
const toastEl     = document.getElementById('toast');
let toastTimer    = null;

function toast(msg, ms = 1800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

// ── Difficulty picker ─────────────────────────────────────────────────────────
document.querySelectorAll('.diff-card').forEach(card => {
  card.addEventListener('click', () => startGame(card.dataset.diff));
});

document.getElementById('btn-new').addEventListener('click', () => {
  showPicker();
});

function showPicker() {
  gameSection.style.display = 'none';
  startScreen.style.display = 'flex';
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
function buildKeyboard() {
  const cfg = DIFF_CFG[difficulty];
  KB_ROWS.forEach((row, i) => {
    const el = document.getElementById(`kr${i}`);
    el.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = k.toUpperCase();
      btn.dataset.k = k;
      const L = k.toUpperCase();
      if (cfg.revealVowels && VOWELS.has(L)) {
        // Pre-mark vowels for easy mode
        btn.dataset.state = 'pre';
        btn.disabled = true;
      } else {
        btn.addEventListener('click', () => handleGuess(k));
      }
      el.appendChild(btn);
    });
  });
}

// ── Hangman drawing ───────────────────────────────────────────────────────────
function resetHangman() {
  ['h-head','h-leye','h-reye','h-body','h-larm','h-rarm','h-lleg','h-rleg']
    .forEach(id => document.getElementById(id).classList.remove('visible'));
}

function showPart(idx) {
  const parts = PARTS[difficulty];
  if (idx < parts.length) document.getElementById(parts[idx]).classList.add('visible');
}

// ── Word display ──────────────────────────────────────────────────────────────
function isRevealed(ch) {
  if (guessed.has(ch)) return true;
  if (DIFF_CFG[difficulty].revealVowels && VOWELS.has(ch)) return true;
  return false;
}

function renderWord(state = 'normal') {
  wordWrap.innerHTML = '';
  for (const ch of target) {
    const slot = document.createElement('div');
    const shown = isRevealed(ch);
    const isVowelPre = DIFF_CFG[difficulty].revealVowels && VOWELS.has(ch) && !guessed.has(ch);

    let cls = 'letter-slot';
    if (isVowelPre && state === 'normal') cls += ' vowel-pre';
    else if (shown)  cls += state === 'win' ? ' win' : ' revealed';
    if (state === 'win') cls = 'letter-slot win';
    if (state === 'lose' && !shown) cls += ' lose';

    slot.className = cls;
    slot.textContent = (shown || state === 'lose') ? ch : '';
    wordWrap.appendChild(slot);
  }
}

// ── Wrong display & guess counter ─────────────────────────────────────────────
function updateWrongDisplay() {
  const wrongs = [...guessed].filter(c => !target.includes(c)).sort();
  wrongDisp.innerHTML = wrongs.length
    ? 'Wrong: ' + wrongs.map(c => `<span class="w-letter">${c}</span>`).join(' ')
    : '—';

  const left = maxWrong - wrongCount;
  guessLeft.textContent = left === 1
    ? '⚠️ Last guess!'
    : left === 0
      ? 'Game over!'
      : `${wrongCount}/${maxWrong} wrong`;
  guessLeft.style.color = left <= 2 ? 'var(--accent)' : 'var(--sub)';
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function saveStats() { localStorage.setItem('focus-hangman-stats', JSON.stringify(stats)); }

function updateStatsUI() {
  document.getElementById('s-streak').textContent = stats.streak;
  document.getElementById('s-wins').textContent   = stats.won;
}

// ── Start game ────────────────────────────────────────────────────────────────
function startGame(diff) {
  difficulty  = diff;
  const cfg   = DIFF_CFG[diff];
  maxWrong    = cfg.maxWrong;
  const pool  = POOLS[diff];
  target      = pool[Math.floor(Math.random() * pool.length)].toUpperCase();
  guessed     = new Set();
  wrongCount  = 0;
  over        = false;

  // Difficulty badge
  const badge = document.getElementById('diff-badge-game');
  badge.textContent   = cfg.label;
  badge.style.color   = cfg.color;
  badge.style.borderColor = cfg.color;

  // Vowel hint
  if (cfg.revealVowels) vowelHint.classList.add('show');
  else                  vowelHint.classList.remove('show');

  startScreen.style.display = 'none';
  gameSection.style.display = 'flex';

  resetHangman();
  buildKeyboard();
  renderWord();
  updateWrongDisplay();
  updateStatsUI();
}

// ── Handle guess ──────────────────────────────────────────────────────────────
function handleGuess(letter) {
  if (over) return;
  const L = letter.toUpperCase();
  if (guessed.has(L)) return;
  // Easy mode: vowels are pre-revealed, skip if accidentally passed
  if (DIFF_CFG[difficulty].revealVowels && VOWELS.has(L)) return;
  guessed.add(L);

  const btn = document.querySelector(`.key[data-k="${letter.toLowerCase()}"]`);

  if (target.includes(L)) {
    if (btn) btn.dataset.state = 'correct';
    renderWord();

    const won = [...target].every(c => isRevealed(c));
    if (won) {
      over = true;
      stats.played++; stats.won++; stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
      saveStats(); updateStatsUI();
      setTimeout(() => {
        renderWord('win');
        const praise = ['Brilliant!','Nailed it!','Nice one!','Got it!','Sharp!'];
        toast(praise[Math.floor(Math.random() * praise.length)] + ' 🎉', 2200);
      }, 80);
    }
  } else {
    if (btn) { btn.dataset.state = 'wrong'; btn.disabled = true; }
    wrongCount++;
    showPart(wrongCount - 1);
    renderWord();
    updateWrongDisplay();

    if (wrongCount >= maxWrong) {
      over = true;
      stats.played++; stats.streak = 0;
      saveStats(); updateStatsUI();
      setTimeout(() => {
        renderWord('lose');
        guessLeft.textContent  = 'Game over!';
        guessLeft.style.color  = 'var(--accent)';
        toast(`The word was ${target}`, 3200);
      }, 300);
    }
  }

  updateWrongDisplay();
}

// ── Physical keyboard ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) handleGuess(e.key.toLowerCase());
});

updateStatsUI();
</script>
