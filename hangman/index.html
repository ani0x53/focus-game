<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLOWS — Hangman</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1b;
      --text: #ffffff;
      --sub: #9ca3af;
      --border: #2d2d2f;
      --accent: #dc2626;
      --green: #538d4e;
      --gray: #3a3a3c;
      --key-bg: #818384;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 500px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .home-link {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .home-link:hover { color: var(--text); }

    .stats {
      display: flex;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stats span strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--accent);
      flex-shrink: 0;
    }

    #btn-new {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #btn-new:hover { opacity: 0.8; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Game area ── */
    #game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      max-width: 500px;
      padding: 6px 16px 4px;
      min-height: 0;
    }

    /* ── Hangman SVG ── */
    #hangman-svg {
      width: min(160px, 40vw);
      height: min(180px, 45vw);
      flex-shrink: 0;
    }

    .h-gallows {
      stroke: #4b5563;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }

    .h-part {
      stroke: var(--text);
      stroke-width: 3.5;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .h-part.visible { opacity: 1; }

    /* ── Wrong letters ── */
    #wrong-display {
      font-size: 0.8rem;
      color: var(--sub);
      letter-spacing: 0.1em;
      min-height: 1.1rem;
      text-align: center;
    }
    .w-letter {
      color: var(--accent);
      text-decoration: line-through;
      margin: 0 1px;
    }

    /* ── Guesses remaining ── */
    #guesses-left {
      font-size: 0.68rem;
      color: var(--sub);
      letter-spacing: 0.06em;
      transition: color 0.3s;
    }

    /* ── Word display ── */
    #word-display {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2px 8px;
    }

    .letter-slot {
      width: clamp(24px, 6.5vw, 34px);
      height: clamp(30px, 8vw, 42px);
      border-bottom: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.95rem, 4vw, 1.35rem);
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
      transition: color 0.2s, border-color 0.2s;
    }
    .letter-slot.revealed { border-bottom-color: var(--green); color: var(--text); }
    .letter-slot.win      { color: #4ade80; border-bottom-color: #4ade80; }
    .letter-slot.lose     { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Keyboard ── */
    #keyboard {
      padding: 2px 4px 10px;
      width: min(460px, 100vw);
      flex-shrink: 0;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .key {
      height: 44px;
      min-width: 10px;
      flex: 1;
      max-width: 38px;
      border-radius: 4px;
      background: var(--key-bg);
      color: var(--text);
      font-weight: 700;
      font-size: 0.78rem;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key:active { filter: brightness(0.8); }
    .key:disabled { cursor: default; }
    .key[data-state="correct"] { background: var(--green); }
    .key[data-state="wrong"]   { background: var(--gray); opacity: 0.4; }
  </style>
</head>
<body>

<div id="toast"></div>

<header>
  <a class="home-link" href="../">← Home</a>
  <div class="stats">
    <span>Streak<strong id="s-streak">0</strong></span>
    <span>Wins<strong id="s-wins">0</strong></span>
  </div>
  <h1>GALLOWS</h1>
  <button id="btn-new">New</button>
</header>

<div id="game-wrap">

  <svg id="hangman-svg" viewBox="0 0 200 210">
    <!-- Gallows (always visible) -->
    <line class="h-gallows" x1="15"  y1="200" x2="125" y2="200"/><!-- base -->
    <line class="h-gallows" x1="50"  y1="200" x2="50"  y2="15"/> <!-- pole -->
    <line class="h-gallows" x1="50"  y1="15"  x2="140" y2="15"/> <!-- arm  -->
    <line class="h-gallows" x1="140" y1="15"  x2="140" y2="38"/> <!-- rope -->
    <!-- Man parts (revealed on each wrong guess) -->
    <circle class="h-part" id="h-head" cx="140" cy="55" r="17"/>
    <line   class="h-part" id="h-body" x1="140" y1="72"  x2="140" y2="128"/>
    <line   class="h-part" id="h-larm" x1="140" y1="92"  x2="113" y2="116"/>
    <line   class="h-part" id="h-rarm" x1="140" y1="92"  x2="167" y2="116"/>
    <line   class="h-part" id="h-lleg" x1="140" y1="128" x2="115" y2="165"/>
    <line   class="h-part" id="h-rleg" x1="140" y1="128" x2="165" y2="165"/>
  </svg>

  <div id="wrong-display">—</div>
  <div id="word-display"></div>
  <div id="guesses-left">6 guesses remaining</div>

</div>

<div id="keyboard">
  <div class="kb-row" id="kr0"></div>
  <div class="kb-row" id="kr1"></div>
  <div class="kb-row" id="kr2"></div>
</div>

const PARTS = ['h-head','h-body','h-larm','h-rarm','h-lleg','h-rleg'];
const MAX_WRONG = 6;

let target = '', guessed = new Set(), wrongCount = 0, over = false;
let stats = JSON.parse(localStorage.getItem('focus-hangman-stats') || 'null')
          || { played: 0, won: 0, streak: 0, best: 0 };

const toastEl   = document.getElementById('toast');
const wordWrap  = document.getElementById('word-display');
const wrongDisp = document.getElementById('wrong-display');
const guessLeft = document.getElementById('guesses-left');
let toastTimer  = null;

function toast(msg, ms = 1800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

// ── Keyboard ─────────────────────────────────────────────────────────────────
const KB_ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];

function buildKeyboard() {
  KB_ROWS.forEach((row, i) => {
    const el = document.getElementById(`kr${i}`);
    el.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = k.toUpperCase();
      btn.dataset.k = k;
      btn.addEventListener('click', () => handleGuess(k));
      el.appendChild(btn);
    });
  });
}

// ── Hangman drawing ───────────────────────────────────────────────────────────
function resetHangman() {
  PARTS.forEach(id => document.getElementById(id).classList.remove('visible'));
}

function showPart(idx) {
  if (idx < PARTS.length) document.getElementById(PARTS[idx]).classList.add('visible');
}

// ── Word display ──────────────────────────────────────────────────────────────
function renderWord(state = 'normal') {
  wordWrap.innerHTML = '';
  for (const ch of target) {
    const slot = document.createElement('div');
    const revealed = guessed.has(ch);
    slot.className = 'letter-slot'
      + (revealed ? ' revealed' : '')
      + (state === 'win'  ? ' win'  : '')
      + (state === 'lose' && !revealed ? ' lose' : '');
    slot.textContent = (revealed || state === 'lose') ? ch : '';
    wordWrap.appendChild(slot);
  }
}

// ── Wrong letters & guesses remaining ────────────────────────────────────────
function updateWrongDisplay() {
  const wrongs = [...guessed].filter(c => !target.includes(c)).sort();
  wrongDisp.innerHTML = wrongs.length
    ? 'Wrong: ' + wrongs.map(c => `<span class="w-letter">${c}</span>`).join(' ')
    : '—';

  const left = MAX_WRONG - wrongCount;
  guessLeft.textContent = left === 1
    ? '⚠️ Last guess!'
    : left === 0
      ? 'Game over!'
      : `${wrongCount}/${MAX_WRONG} wrong`;
  guessLeft.style.color = left <= 2 ? 'var(--accent)' : 'var(--sub)';
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function saveStats() {
  localStorage.setItem('focus-hangman-stats', JSON.stringify(stats));
}

function updateStatsUI() {
  document.getElementById('s-streak').textContent = stats.streak;
  document.getElementById('s-wins').textContent   = stats.won;
}

// ── New game ──────────────────────────────────────────────────────────────────
function newGame() {
  target     = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  guessed    = new Set();
  wrongCount = 0;
  over       = false;

  resetHangman();
  buildKeyboard();
  renderWord();
  updateWrongDisplay();
  updateStatsUI();
}

// ── Handle a letter guess ─────────────────────────────────────────────────────
function handleGuess(letter) {
  if (over) return;
  const L = letter.toUpperCase();
  if (guessed.has(L)) return;
  guessed.add(L);

  const btn = document.querySelector(`.key[data-k="${letter.toLowerCase()}"]`);

  if (target.includes(L)) {
    if (btn) btn.dataset.state = 'correct';
    renderWord();

    const won = [...target].every(c => guessed.has(c));
    if (won) {
      over = true;
      stats.played++; stats.won++; stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
      saveStats(); updateStatsUI();
      setTimeout(() => {
        renderWord('win');
        const praise = ['Brilliant!','Nailed it!','Nice one!','Got it!','Sharp!'];
        toast(praise[Math.floor(Math.random() * praise.length)] + ' 🎉', 2200);
      }, 80);
    }
  } else {
    if (btn) { btn.dataset.state = 'wrong'; btn.disabled = true; }
    wrongCount++;
    showPart(wrongCount - 1);
    renderWord();
    updateWrongDisplay();

    if (wrongCount >= MAX_WRONG) {
      over = true;
      stats.played++; stats.streak = 0;
      saveStats(); updateStatsUI();
      setTimeout(() => {
        renderWord('lose');
        guessLeft.textContent = 'Game over!';
        guessLeft.style.color = 'var(--accent)';
        toast(`The word was ${target}`, 3200);
      }, 300);
    }
  }

  updateWrongDisplay();
}

// ── Physical keyboard ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) handleGuess(e.key.toLowerCase());
});

document.getElementById('btn-new').addEventListener('click', newGame);

buildKeyboard();
newGame();
</script>
