<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEXIS — Word Game</title>
  <style>
    :root {
      --bg: #121213;
      --surface: #1a1a1b;
      --text: #ffffff;
      --subtext: #818384;
      --border: #3a3a3c;
      --border-filled: #565758;
      --green: #538d4e;
      --yellow: #b59f3b;
      --gray: #3a3a3c;
      --key-bg: #818384;
      --accent: #7c3aed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 500px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .home-link {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .home-link:hover { color: var(--text); }

    .stats {
      display: flex;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stats span strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: var(--accent);
      flex-shrink: 0;
    }

    #btn-new {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #btn-new:hover { opacity: 0.8; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── Board ── */
    #board-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      min-height: 0;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      width: min(300px, 88vw);
      height: min(360px, 46vh);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 6vw, 1.9rem);
      font-weight: 700;
      text-transform: uppercase;
    }

    .tile.has-letter {
      border-color: var(--border-filled);
      animation: pop 0.08s ease;
    }

    .tile.revealed { animation: flip 0.45s ease forwards; }

    .tile[data-state="correct"] { --rc: var(--green); }
    .tile[data-state="present"] { --rc: var(--yellow); }
    .tile[data-state="absent"]  { --rc: var(--gray); }

    @keyframes pop {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    @keyframes flip {
      0%  { transform: rotateX(0);    background: transparent; border-color: var(--border-filled); color: var(--text); }
      45% { transform: rotateX(90deg); background: transparent; }
      55% { transform: rotateX(90deg); background: var(--rc); border-color: var(--rc); }
      100%{ transform: rotateX(0);    background: var(--rc); border-color: var(--rc); }
    }

    .row.shake { animation: shake 0.45s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%,55% { transform: translateX(-5px); }
      35%,75% { transform: translateX(5px); }
    }

    .tile.win-bounce { animation: bounce 0.5s ease forwards; }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      40%     { transform: translateY(-22px); }
      70%     { transform: translateY(-8px); }
    }

    /* ── Action buttons (Enter / Back) ── */
    #kb-actions {
      display: flex;
      gap: 10px;
      padding: 6px 8px 4px;
      width: min(500px, 100vw);
      flex-shrink: 0;
    }

    .action-key {
      flex: 1;
      height: 58px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .action-key:active { filter: brightness(0.8); }

    #btn-back  { background: var(--key-bg); color: var(--text); }
    #btn-enter { background: var(--green);  color: #fff; }

    /* ── Keyboard ── */
    #keyboard {
      padding: 2px 8px 12px;
      width: min(500px, 100vw);
      flex-shrink: 0;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .key {
      height: 52px;
      min-width: 10px;
      flex: 1;
      max-width: 42px;
      border-radius: 4px;
      background: var(--key-bg);
      color: var(--text);
      font-weight: 700;
      font-size: 0.78rem;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.25s, color 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key.wide { max-width: 64px; font-size: 0.68rem; }
    .key:active { filter: brightness(0.8); }

    .key[data-state="correct"] { background: var(--green);  color: #fff; }
    .key[data-state="present"] { background: var(--yellow); color: #fff; }
    .key[data-state="absent"]  { background: var(--gray);   color: #fff; }

    /* ── Intro overlay ── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
    }
    #overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 32px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .modal h2 { font-size: 1.2rem; letter-spacing: 0.1em; margin-bottom: 14px; }
    .modal p  { font-size: 0.85rem; color: var(--subtext); line-height: 1.6; margin-bottom: 10px; }

    .example-row { display: flex; gap: 4px; justify-content: center; margin: 8px 0; }
    .ex-tile {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
      border: 2px solid var(--border);
      text-transform: uppercase;
    }
    .ex-tile.green  { background: var(--green);  border-color: var(--green);  }
    .ex-tile.yellow { background: var(--yellow); border-color: var(--yellow); }
    .ex-tile.gray   { background: var(--gray);   border-color: var(--gray);   }

    #btn-start {
      margin-top: 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #btn-start:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div id="overlay">
  <div class="modal">
    <h2>HOW TO PLAY</h2>
    <p>Guess the 5-letter word in <strong>6 tries</strong>.</p>

    <div class="example-row">
      <div class="ex-tile green">W</div>
      <div class="ex-tile">E</div>
      <div class="ex-tile">A</div>
      <div class="ex-tile">R</div>
      <div class="ex-tile">Y</div>
    </div>
    <p><strong style="color:var(--green)">W</strong> is in the right spot.</p>

    <div class="example-row">
      <div class="ex-tile">P</div>
      <div class="ex-tile yellow">I</div>
      <div class="ex-tile">L</div>
      <div class="ex-tile">L</div>
      <div class="ex-tile">S</div>
    </div>

    <div class="example-row">

      <div class="ex-tile">A</div>
      <div class="ex-tile">G</div>
      <div class="ex-tile gray">U</div>
      <div class="ex-tile">E</div>
    </div>
    <p><strong style="color:var(--subtext)">U</strong> is not in the word.</p>

    <button id="btn-start">Let's go!</button>
  </div>
</div>

<div id="toast"></div>

<header>
  <a class="home-link" href="../">← Home</a>
  <div class="stats">
    <span>Streak<strong id="s-streak">0</strong></span>

    <span>Wins<strong id="s-wins">0</strong></span>
  </div>
  <h1>LEXIS</h1>
  <button id="btn-new">New</button>
</header>

<div id="board-wrap">
  <div id="board"></div>
</div>

<div id="kb-actions">
  <button id="btn-back"  class="action-key">⌫ Back</button>
  <button id="btn-enter" class="action-key">Enter ↵</button>
</div>

<div id="keyboard">
  <div class="kb-row" id="kr0"></div>
  <div class="kb-row" id="kr1"></div>
  <div class="kb-row" id="kr2"></div>
</div>

// ── Dictionary validation via Free Dictionary API ────────────────────────────
// Cache valid & invalid words in localStorage so lookups are instant after first check
const _raw = JSON.parse(localStorage.getItem('lexis-dict-cache') || '{"ok":[],"no":[]}');
const DICT_OK  = new Set([..._raw.ok,  ...WORDS.map(w => w.toLowerCase())]);
const DICT_NO  = new Set(_raw.no);

function _saveCache() {
  localStorage.setItem('lexis-dict-cache', JSON.stringify({
    ok: [...DICT_OK],
    no: [...DICT_NO].slice(-500) // cap negatives to avoid unbounded growth
  }));
}

async function isRealWord(word) {
  const lc = word.toLowerCase();
  if (DICT_OK.has(lc))  return true;
  if (DICT_NO.has(lc))  return false;
  try {
    const res = await fetch(
      `https://api.dictionaryapi.dev/api/v2/entries/en/${lc}`,
      { signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined }
    );
    if (res.ok) { DICT_OK.add(lc); _saveCache(); return true;  }
    else        { DICT_NO.add(lc); _saveCache(); return false; }
  } catch {
    return true; // if API unreachable (offline), allow the word
  }
}

const boardEl = document.getElementById('board');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg, ms = 1600) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

function buildBoard() {
  boardEl.innerHTML = '';
  grid = Array.from({length:6}, () => Array(5).fill(''));
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row'; row.id = `r${r}`;
    for (let c = 0; c < 5; c++) {
      const t = document.createElement('div');
      t.className = 'tile'; t.id = `t${r}${c}`;
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
}

  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];

function buildKeyboard() {
  KB_ROWS.forEach((row, i) => {
    const el = document.getElementById(`kr${i}`);
    el.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k; btn.dataset.k = k;
      btn.addEventListener('click', () => handleKey(k));
      el.appendChild(btn);
    });
  });
}

function newGame() {
  target = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  curRow = 0; curCol = 0; over = false;
  buildBoard(); buildKeyboard(); updateStats();
}

function updateStats() {
  document.getElementById('s-streak').textContent = stats.streak;
  document.getElementById('s-best').textContent   = stats.best;
  document.getElementById('s-wins').textContent   = stats.won;
}

function handleKey(k) {
  if (over) return;
  if (k === '⌫' || k === 'Backspace') {
    if (curCol > 0) {
      curCol--;
      grid[curRow][curCol] = '';
      const t = document.getElementById(`t${curRow}${curCol}`);
      t.textContent = ''; t.classList.remove('has-letter');
    }
  } else if (k === 'Enter') {
    submit();
  } else if (/^[a-zA-Z]$/.test(k) && curCol < 5) {
    const letter = k.toUpperCase();
    grid[curRow][curCol] = letter;
    const t = document.getElementById(`t${curRow}${curCol}`);
    t.textContent = letter; t.classList.add('has-letter');
    curCol++;
  }
}

let _checking = false;
async function submit() {
  if (_checking) return;
  if (curCol < 5) { toast('Need 5 letters!'); shakeRow(curRow); return; }
  const guess = grid[curRow].join('');

  _checking = true;
  toast('Checking…', 9999);
  const valid = await isRealWord(guess);
  _checking = false;
  toastEl.classList.remove('show');

  if (!valid) { toast('Not a real word'); shakeRow(curRow); return; }

  const result = evaluate(guess);
  revealRow(curRow, result, guess);
  const won = result.every(s => s === 'correct');
  const row = curRow;
  curRow++; curCol = 0;

  setTimeout(() => {
    if (won) {
      const praise = ['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
      toast(praise[row] || 'Nice!', 2200);
      bounceRow(row);
      over = true;
      stats.played++; stats.won++; stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
    } else if (curRow === 6) {
      toast(target, 3000);
      over = true;
      stats.played++; stats.streak = 0;
    }
    if (over) { localStorage.setItem('focus-v1-stats', JSON.stringify(stats)); updateStats(); }
  }, 5 * 320 + 100);
}

function evaluate(guess) {
  const result = Array(5).fill('absent');
  const tArr = target.split(''), gArr = guess.split('');
  for (let i = 0; i < 5; i++) {
    if (gArr[i] === tArr[i]) { result[i] = 'correct'; tArr[i] = null; gArr[i] = null; }
  }
  for (let i = 0; i < 5; i++) {
    if (gArr[i] !== null) {
      const j = tArr.indexOf(gArr[i]);
      if (j !== -1) { result[i] = 'present'; tArr[j] = null; }
    }
  }
  return result;
}

function revealRow(row, result, guess) {
  for (let c = 0; c < 5; c++) {
    setTimeout(() => {
      const t = document.getElementById(`t${row}${c}`);
      t.dataset.state = result[c]; t.classList.add('revealed');
      const btn = document.querySelector(`.key[data-k="${guess[c].toLowerCase()}"]`);
      if (btn) {
        const priority = { correct:2, present:1, absent:0 };
        if ((priority[result[c]] ?? -1) > (priority[btn.dataset.state] ?? -1)) btn.dataset.state = result[c];
      }
    }, c * 320);
  }
}

function shakeRow(row) {
  const el = document.getElementById(`r${row}`);
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 500);
}

function bounceRow(row) {
  document.querySelectorAll(`#r${row} .tile`).forEach((t, i) => {
    setTimeout(() => t.classList.add('win-bounce'), i * 100);
  });
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Backspace') handleKey('Backspace');
  else if (e.key === 'Enter') handleKey('Enter');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key);
});

document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('btn-back').addEventListener('click', () => handleKey('⌫'));
document.getElementById('btn-enter').addEventListener('click', () => handleKey('Enter'));
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
});

buildKeyboard();
newGame();
updateStats();
</script>
</body>
</html>
