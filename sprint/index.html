<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPRINT — Math Game</title>
  <style>
    :root {
      --bg: #0f0f10;
      --surface: #1a1a1b;
      --text: #ffffff;
      --sub: #9ca3af;
      --border: #3a3a3c;
      --accent: #ea580c;
      --green: #4ade80;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    header {
      width: 100%;
      max-width: 420px;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .home-link {
      color: var(--sub); text-decoration: none;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .home-link:hover { color: var(--text); }

    h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.18em; color: var(--accent); }

    /* ── Stats bar ── */
    .top-bar {
      display: flex; justify-content: space-around;
      width: 100%; max-width: 420px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 0.68rem; color: var(--sub); letter-spacing: 0.08em; text-transform: uppercase; }
    .stat-value { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    #score-val { color: var(--accent); }
    #time-val  { color: var(--text); }
    #best-val  { color: var(--sub); font-size: 1.2rem; }

    /* ── Timer bar ── */
    #timer-bar-wrap {
      width: 100%; max-width: 420px;
      height: 4px;
      background: var(--border);
    }
    #timer-bar {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 1s linear, background 0.3s;
    }

    /* ── Game area ── */
    #game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px 16px;
      width: 100%;
      max-width: 420px;
    }

    /* ── Idle / ready screen ── */
    #ready-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .ready-icon { font-size: 3.5rem; }
    .ready-title { font-size: 1.2rem; font-weight: 700; color: var(--sub); letter-spacing: 0.1em; }
    .ready-rules {
      font-size: 0.82rem;
      color: var(--sub);
      line-height: 1.7;
      max-width: 280px;
    }

    /* ── Problem ── */
    #problem-wrap { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; }

    #problem {
      font-size: clamp(2rem, 10vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-align: center;
      min-height: 1.2em;
      transition: opacity 0.1s;
    }

    #feedback {
      font-size: 1.4rem;
      font-weight: 700;
      min-height: 2rem;
      text-align: center;
    }
    #feedback.correct { color: var(--green); }
    #feedback.wrong   { color: var(--red); }

    #answer-wrap {
      display: flex; gap: 10px; align-items: center; width: 100%; max-width: 300px;
    }

    #answer {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      padding: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    #answer:focus { border-color: var(--accent); }
    #answer.correct { border-color: var(--green); }
    #answer.wrong   { border-color: var(--red); animation: shake 0.3s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%,75% { transform: translateX(-6px); }
      50%     { transform: translateX(6px); }
    }

    /* ── Buttons ── */
    .big-btn {
      padding: 14px 36px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .big-btn:hover  { opacity: 0.88; }
    .big-btn:active { transform: scale(0.96); }

    #submit-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #submit-btn:hover { opacity: 0.85; }

    /* ── Game over ── */
    #gameover { display: none; flex-direction: column; align-items: center; gap: 16px; text-align: center; }

    .go-score { font-size: 4rem; font-weight: 900; color: var(--accent); }
    .go-label { font-size: 0.8rem; color: var(--sub); letter-spacing: 0.1em; text-transform: uppercase; }
    .go-best  { font-size: 1rem; color: var(--sub); }
    .go-best strong { color: var(--text); }

    /* ── Level indicator ── */
    #level-badge {
      font-size: 0.7rem;
      color: var(--sub);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <a class="home-link" href="../">← Home</a>
  <h1>SPRINT</h1>
  <div style="width:60px"></div>
</header>

<div class="top-bar">
  <div class="stat-box">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="score-val">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Time</div>
    <div class="stat-value" id="time-val">60</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Best</div>
    <div class="stat-value" id="best-val">—</div>
  </div>
</div>

<div id="timer-bar-wrap"><div id="timer-bar"></div></div>

<div id="game-area">

  <div id="ready-screen">
    <div class="ready-icon">⚡</div>
    <div class="ready-title">MATH SPRINT</div>
    <div class="ready-rules">
      Solve as many problems as you can in <strong>60 seconds</strong>.<br>
      Type the answer and press <strong>Enter</strong>.<br>
      Problems get harder as your score grows.
    </div>
    <button class="big-btn" id="start-btn">START</button>
  </div>

  <div id="problem-wrap">
    <div id="level-badge"></div>
    <div id="problem">—</div>
    <div id="feedback"></div>
    <div id="answer-wrap">
      <input id="answer" type="number" inputmode="numeric" autocomplete="off"
             placeholder="?" autofocus>
      <button id="submit-btn">Go</button>
    </div>
  </div>

  <div id="gameover">
    <div class="go-score" id="go-score">0</div>
    <div class="go-label">correct answers</div>
    <div class="go-best" id="go-best"></div>
    <button class="big-btn" id="play-again-btn">Play Again</button>
  </div>

</div>

<script>
// ─── Stats ────────────────────────────────────────────────────────────────────
let stats = JSON.parse(localStorage.getItem('focus-sprint-stats') || 'null') || { best:0, played:0 };

function saveStats() {
  localStorage.setItem('focus-sprint-stats', JSON.stringify(stats));
  document.getElementById('best-val').textContent = stats.best || '—';
}
saveStats();

// ─── Problem Generator ────────────────────────────────────────────────────────
const OPS = ['+', '−', '×', '÷'];

function generateProblem(score) {
  // Level: 0-4 (based on score)
  const level = Math.min(4, Math.floor(score / 5));
  let a, b, op, answer;

  const available = level === 0 ? ['+','−'] :
                    level === 1 ? ['+','−','×'] :
                                  ['+','−','×','÷'];
  op = available[Math.floor(Math.random() * available.length)];

  if (op === '+') {
    const max = level < 2 ? 10 : level < 3 ? 30 : 99;
    a = Math.floor(Math.random() * max) + 1;
    b = Math.floor(Math.random() * max) + 1;
    answer = a + b;
  } else if (op === '−') {
    const max = level < 2 ? 10 : level < 3 ? 30 : 50;
    b = Math.floor(Math.random() * max) + 1;
    a = b + Math.floor(Math.random() * max);
    answer = a - b;
  } else if (op === '×') {
    const maxA = level < 3 ? 6 : 12;
    const maxB = level < 3 ? 6 : 12;
    a = Math.floor(Math.random() * maxA) + 2;
    b = Math.floor(Math.random() * maxB) + 2;
    answer = a * b;
  } else { // ÷
    b = Math.floor(Math.random() * 9) + 2;
    answer = Math.floor(Math.random() * 12) + 2;
    a = b * answer;
  }

  const levels = ['Warm-up','Easy','Medium','Hard','Insane'];
  return { text: `${a} ${op} ${b} = ?`, answer, levelName: levels[level] };
}

// ─── Game State ────────────────────────────────────────────────────────────────
let score = 0;
let timeLeft = 60;
let timerHandle = null;
let currentProblem = null;
let running = false;
let feedbackTimer = null;

const readyScreen  = document.getElementById('ready-screen');
const problemWrap  = document.getElementById('problem-wrap');
const gameoverEl   = document.getElementById('gameover');
const problemEl    = document.getElementById('problem');
const feedbackEl   = document.getElementById('feedback');
const answerEl     = document.getElementById('answer');
const scoreVal     = document.getElementById('score-val');
const timeVal      = document.getElementById('time-val');
const timerBar     = document.getElementById('timer-bar');
const levelBadge   = document.getElementById('level-badge');

// ─── Timer ────────────────────────────────────────────────────────────────────
function startTimer() {
  timerHandle = setInterval(() => {
    timeLeft--;
    timeVal.textContent = timeLeft;
    timerBar.style.width = (timeLeft / 60 * 100) + '%';
    if (timeLeft <= 10) timerBar.style.background = '#ef4444';
    if (timeLeft <= 0) endGame();
  }, 1000);
}

// ─── Start ────────────────────────────────────────────────────────────────────
function startGame() {
  score = 0; timeLeft = 60; running = true;
  scoreVal.textContent = '0';
  timeVal.textContent  = '60';
  timerBar.style.width = '100%';
  timerBar.style.background = 'var(--accent)';

  readyScreen.style.display  = 'none';
  gameoverEl.style.display   = 'none';
  problemWrap.style.display  = 'flex';

  nextProblem();
  startTimer();
  answerEl.focus();
}

function nextProblem() {
  currentProblem = generateProblem(score);
  problemEl.textContent    = currentProblem.text;
  levelBadge.textContent   = currentProblem.levelName;
  answerEl.value           = '';
  feedbackEl.textContent   = '';
  feedbackEl.className     = '';
  answerEl.className       = '';
  answerEl.focus();
}

// ─── Submit ────────────────────────────────────────────────────────────────────
function submitAnswer() {
  if (!running || !currentProblem) return;
  const val = parseInt(answerEl.value, 10);
  if (isNaN(val)) return;

  clearTimeout(feedbackTimer);

  if (val === currentProblem.answer) {
    score++;
    scoreVal.textContent = score;
    feedbackEl.textContent = '✓ Correct!';
    feedbackEl.className   = 'correct';
    answerEl.className     = 'correct';
    feedbackTimer = setTimeout(nextProblem, 300);
  } else {
    feedbackEl.textContent = `✗  Answer was ${currentProblem.answer}`;
    feedbackEl.className   = 'wrong';
    answerEl.className     = 'wrong';
    feedbackTimer = setTimeout(nextProblem, 900);
  }
}

// ─── End ─────────────────────────────────────────────────────────────────────
function endGame() {
  clearInterval(timerHandle);
  running = false;

  stats.played++;
  const isNewBest = score > stats.best;
  if (isNewBest) stats.best = score;
  saveStats();

  problemWrap.style.display = 'none';
  gameoverEl.style.display  = 'flex';
  document.getElementById('go-score').textContent = score;
  document.getElementById('go-best').innerHTML =
    isNewBest
      ? `<strong style="color:#4ade80">New best!</strong> 🎉`
      : `Best: <strong>${stats.best}</strong>`;
}

// ─── Events ───────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('play-again-btn').addEventListener('click', startGame);
document.getElementById('submit-btn').addEventListener('click', submitAnswer);

answerEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

// prevent non-numeric input (minus allowed for negative results)
answerEl.addEventListener('input', () => {
  answerEl.value = answerEl.value.replace(/[^0-9\-]/g, '');
});
</script>
</body>
</html>
